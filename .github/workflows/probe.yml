name: probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for p in / /events/ /events/list/ /lcw/ "/wp-json/tribe/events/v1/events?per_page=1" "/?feed=rss2" "/events/?ical=1" "/wp-sitemap.xml" "/wp-json/wp/v2/pages?per_page=1"; do
            curl -s -o /dev/null -D - -A "frp-events-watch/1.0" "https://www.familyrenewalproject.com$p" | grep -iE "^HTTP|cf-mitigated" | tr '\r\n' '  '; echo " <- $p"
          done
